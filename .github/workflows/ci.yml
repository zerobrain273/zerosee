name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev nlohmann-json3-dev python3 openssl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 2
      - name: Test including real loopback HTTP and HTTPS
        env:
          ZEROSEE_REQUIRE_NETWORK_TESTS: '1'
        run: ctest --test-dir build --output-on-failure
      - name: Demonstration
        run: python3 lab/demo.py
